[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-iot-forensics"
version = "1.3.1"
description = "Local IoT incident reconstruction from supplied evidence"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
nexus-iot = "nexus_iot.__main__:main"

[tool.setuptools.packages.find]
include = ["nexus_iot*"]
